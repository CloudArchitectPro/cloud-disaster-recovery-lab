name: cloud-dr-lab
services:
  source:
    # Major-version pin with explicit Debian variant; immutable digest pending registry verification.
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: lab_owner
      POSTGRES_PASSWORD: local-demo-only-not-a-secret
      POSTGRES_DB: labdb
    volumes:
      - source_data:/var/lib/postgresql/data
      - ../../sample-data/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ../../sample-data/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    networks: [lab_internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab_owner -d labdb && psql -U lab_owner -d labdb -tAc 'SELECT 1 FROM lab.assets LIMIT 1' | grep -qx 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    restart: 'no'
  recovery:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: lab_owner
      POSTGRES_PASSWORD: local-demo-only-not-a-secret
      POSTGRES_DB: labdb
    volumes:
      - recovery_data:/var/lib/postgresql/data
    networks: [lab_internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab_owner -d labdb && psql -U lab_owner -d labdb -tAc 'SELECT 1' | grep -qx 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    restart: 'no'
networks:
  lab_internal:
    internal: true
volumes:
  source_data:
  recovery_data:
