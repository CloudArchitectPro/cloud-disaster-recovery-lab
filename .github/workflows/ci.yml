name: Foundation checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (pinned to v4.2.2 commit)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate foundation content and confidentiality patterns
        run: python3 tests/foundation_check.py
      - name: Validate Compose syntax
        run: docker compose -f infrastructure/docker/compose.yaml config --quiet
